<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbourside machine check</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e7dcc6;
      color: #1c1915;
      font: 18px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    h1 { font-size: 1.7rem; line-height: 1.15; margin: 0 0 .25rem; }
    .lede { margin: 0 0 1rem; color: #3d3832; }
    form, .card, .choice { background: #fffaf3; border: 2px solid #1c1915; border-radius: 12px; }
    form { padding: 1rem; }
    label { display: block; font-weight: 700; margin-bottom: .4rem; }
    input {
      width: 100%;
      font: inherit;
      padding: .8rem .9rem;
      border: 2px solid #1c1915;
      border-radius: 8px;
      background: #fff;
    }
    button {
      font: inherit;
      font-weight: 700;
      border: 2px solid #1c1915;
      border-radius: 8px;
      background: #163e78;
      color: #fff;
      min-height: 3.2rem;
      padding: .6rem 1rem;
      width: 100%;
      margin-top: .75rem;
    }
    button.secondary { background: #fffaf3; color: #1c1915; }
    .card { margin-top: 1rem; padding: 1rem; }
    .verdict { font-size: 1.35rem; font-weight: 700; margin: 0; }
    .verdict + .verdict { margin-top: .7rem; }
    .bad { color: #8d1d2c; }
    .ok { color: #0d6b3d; }
    .warn { color: #8a5a00; }
    .name { font-size: 1.15rem; margin: 0 0 .35rem; }
    ul { list-style: none; padding: 0; margin: .8rem 0 0; }
    li { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0; border-top: 1px solid #e4d8c4; }
    .slot { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid #e4d8c4; }
    .slot h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
    .muted { color: #5c564e; margin: .2rem 0; }
    .choice { display: block; width: 100%; text-align: left; margin-top: .5rem; background: #fffaf3; color: #1c1915; }
    .hidden { display: none; }
    .foot { margin: 1rem 0 0; color: #5c564e; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Harbourside machine check</h1>
    <p class="lede">See if you can use a machine. No password.</p>
    <form id="lookup">
      <label for="who">Member number, name, or email</label>
      <input id="who" name="who" autocomplete="off" autocapitalize="off" enterkeyhint="go">
      <button type="submit">Check</button>
      <p id="miss" class="bad hidden" role="status"></p>
    </form>
    <section id="picks" class="card hidden" aria-label="Which member"></section>
    <section id="result" class="card hidden" aria-live="polite"></section>
    <p class="foot" id="source">Nothing you type is saved. Phones and birth years are not kept. The check runs on this phone.</p>
  </main>
  <script src="records.js"></script>
  <script src="check.js"></script>
  <script src="sheets.js"></script>
  <script>
    const who = document.querySelector("#who");
    const miss = document.querySelector("#miss");
    const picks = document.querySelector("#picks");
    const result = document.querySelector("#result");
    let records = window.RECORDS;
    const source = document.querySelector("#source");

    function keyify(label) {
      return String(label || "").toLowerCase().replace(/[^a-z]/g, "");
    }

    function gvizObjects(payload) {
      const cols = payload.table.cols.map((col) => keyify(col.label));
      return (payload.table.rows || []).map((row) => {
        const obj = {};
        cols.forEach((key, index) => {
          const cell = row.c && row.c[index];
          if (!cell || (cell.v == null && cell.f == null)) {
            obj[key] = "";
            return;
          }
          if (typeof cell.v === "string" && cell.v.indexOf("Date(") === 0) {
            const parts = cell.v.match(/\d+/g).map(Number);
            obj[key] = parts[0] + "-" + String(parts[1] + 1).padStart(2, "0") + "-" + String(parts[2]).padStart(2, "0");
            return;
          }
          obj[key] = cell.f != null ? String(cell.f) : String(cell.v);
        });
        return obj;
      }).filter((row) => Object.keys(row).some((key) => row[key]));
    }

    function loadSheet(id) {
      return new Promise((resolve, reject) => {
        const callback = "gviz_" + Math.random().toString(36).slice(2);
        const timer = setTimeout(() => {
          delete window[callback];
          reject(new Error("timeout"));
        }, 8000);
        window[callback] = (payload) => {
          clearTimeout(timer);
          delete window[callback];
          resolve(gvizObjects(payload));
        };
        const script = document.createElement("script");
        script.src = "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=out:json;responseHandler:" + callback;
        script.onerror = () => {
          clearTimeout(timer);
          reject(new Error("sheet"));
        };
        document.head.appendChild(script);
      });
    }

    function rowsFromSaved(saved) {
      const memberRows = saved.members.map((member) => ({
        membernumber: member.id,
        first: member.first,
        last: member.last,
        email: member.email,
        status: member.status,
        youth: member.youth ? "yes" : "",
        parent: member.parent || "",
      }));
      const cardRows = [];
      saved.members.forEach((member) => {
        const name = member.first + " " + member.last;
        (member.machines || []).forEach((machine) => cardRows.push({ type: "signoff", name, membernumber: member.id, machine, since: "", note: "" }));
        (member.waitlist || []).forEach((item) => cardRows.push({ type: "waiting", name, membernumber: member.id, machine: item.machine, since: item.since, note: item.note || "" }));
      });
      return { memberRows, cardRows };
    }

    const sheets = window.SHEETS || {};
    function tryLoad(id) {
      return id ? loadSheet(id).catch(() => null) : Promise.resolve(null);
    }
    if (sheets.board || sheets.members || sheets.cards) {
      Promise.all([tryLoad(sheets.members), tryLoad(sheets.cards), tryLoad(sheets.board)]).then((tables) => {
        const baked = rowsFromSaved(window.RECORDS);
        const memberRows = tables[0] || baked.memberRows;
        const cardRows = tables[1] || baked.cardRows;
        const boardRows = tables[2];
        if (!boardRows) {
          if (source) source.textContent = "Using this week's saved copy. The shop sheets are not public yet.";
          return;
        }
        records = Harbour.buildFromTables(memberRows, cardRows, boardRows);
        if (source) source.textContent = tables[0] && tables[1]
          ? "Reading the shop sheets. Next week is typed there. Nobody has to publish code."
          : "Reading the board sheet. Sign-offs are still this week's saved copy.";
      });
    }

    function resetAnswer() {
      miss.classList.add("hidden");
      picks.classList.add("hidden");
      result.classList.add("hidden");
      picks.innerHTML = "";
      result.innerHTML = "";
    }

    function esc(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }

    function againButton() {
      return '<button type="button" class="secondary" id="again">Check someone else</button>';
    }

    function wireAgain() {
      document.querySelector("#again").addEventListener("click", () => {
        who.value = "";
        resetAnswer();
        who.focus();
      });
    }

    function showMember(member) {
      const report = Harbour.explain(member, records.bookings, records.members, new Date());
      const lines = report.sentences.map((sentence) => {
        const bad = /can't|not signed|lapsed|waiting|parent has to|not confirmed|big laser/i.test(sentence);
        return '<p class="' + (bad ? "bad" : "muted") + '">' + esc(sentence) + "</p>";
      }).join("");
      const signed = "<ul>" + report.signed.map((row) => {
        const state = row.note ? "warn" : row.yes ? "ok" : "bad";
        const word = row.note || (row.yes ? "Signed off" : "Not signed off");
        return "<li><span>" + row.label + "</span><strong class=\"" + state + "\">" + esc(word) + "</strong></li>";
      }).join("") + "</ul>";
      const slots = report.cards.length
        ? report.cards.map((card) => {
            const state = card.when === "past" ? "Already passed" : card.when === "next" ? "Coming up" : "Today";
            const problems = card.problems.map((line) => '<p class="bad">' + esc(line) + "</p>").join("");
            const fine = card.problems.length ? "" : '<p class="ok">This booking fits the rules.</p>';
            const rules = (card.rules || []).map((line) => '<p class="muted">' + esc(line) + "</p>").join("");
            const note = card.note ? " (" + esc(card.note) + ")" : "";
            return '<div class="slot"><h2>' + esc(card.day + " " + card.start + "–" + card.end + " · " + card.label) + "</h2><p class=\"muted\">" + esc(state + " · Board says " + card.text) + note + "</p>" + problems + fine + rules + "</div>";
          }).join("")
        : '<p class="muted">Your name is not on this week’s whiteboard.</p>';
      const loose = report.unmatched.length
        ? '<div class="slot"><h2>Names the board does not match</h2>' + report.unmatched.map((line) => '<p class="bad">' + esc(line) + "</p>").join("") + "</div>"
        : "";
      result.innerHTML = '<p class="verdict ' + (report.leadOk ? "ok" : "bad") + '">' + esc(report.lead) + "</p>" + againButton() + lines + signed + slots + loose;
      result.classList.remove("hidden");
      wireAgain();
      result.scrollIntoView({ block: "nearest" });
    }

    document.querySelector("#lookup").addEventListener("submit", (event) => {
      event.preventDefault();
      resetAnswer();
      const matches = Harbour.find(who.value, records.members);
      if (!matches.length) {
        miss.textContent = "That doesn’t match a member. Use the number on your fob tag, or your full name.";
        miss.classList.remove("hidden");
        return;
      }
      if (matches.length === 1) {
        showMember(matches[0]);
        return;
      }
      picks.innerHTML = "<h2>Which one are you?</h2>" + matches.map((member) =>
        '<button type="button" class="choice" data-id="' + member.id + '">' + esc(member.first + " " + member.last) + "</button>"
      ).join("");
      picks.classList.remove("hidden");
      picks.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          const member = records.members.find((person) => person.id === button.dataset.id);
          picks.classList.add("hidden");
          showMember(member);
        });
      });
    });
    who.focus();
  </script>
</body>
</html>
